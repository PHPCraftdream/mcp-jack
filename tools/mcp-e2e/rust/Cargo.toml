[package]
name = "mcp-e2e-rust"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "mcp-e2e-rust-server"
path = "src/bin/server.rs"

[[bin]]
name = "mcp-e2e-rust-client"
path = "src/bin/client.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rmcp = { version = "=3.9.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "signal"] }
