[package]
name = "mcp-jack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Secure transport protocol wrapping MCP: authentication, authorization, audit (server SDK)."
publish = false

[lib]
name = "mcp_jack"

[features]
default = []
http = ["dep:http", "dep:bytes", "dep:http-body-util", "dep:tower-service", "dep:tower-layer"]

[dependencies]
ed25519-dalek = { version = "2.2", features = ["std"] }
curve25519-dalek = "4.1"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.2"

http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true, features = ["channel"] }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
