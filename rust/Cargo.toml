[package]
name = "mcp-jack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Client and server SDK for authenticated MCP over HTTP, with verified caller identity, protocol admin tools, and audit."
keywords = ["mcp", "authentication", "ed25519", "client", "server"]
categories = ["authentication", "cryptography", "network-programming"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PHPCraftdream/mcp-jack"
publish = false

[lib]
name = "mcp_jack"

[features]
default = []
http = ["dep:http", "dep:bytes", "dep:http-body-util", "dep:tower-service", "dep:tower-layer"]
interop = ["http", "dep:hyper", "dep:hyper-util", "dep:tokio"]
client-http = ["dep:http", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "dep:hyper-util", "dep:tokio", "tokio/rt", "tokio/time", "tokio/sync", "tokio/io-util", "dep:tokio-rustls", "dep:webpki-roots", "dep:hickory-resolver", "dep:hickory-net", "dep:hickory-proto"]

[[bin]]
name = "interop-server"
path = "src/bin/interop_server.rs"
required-features = ["interop"]

[[bin]]
name = "interop-client"
path = "src/bin/interop_client.rs"
required-features = ["interop"]

[[bin]]
name = "interop-transfer"
path = "src/bin/interop_transfer.rs"
required-features = ["interop"]

[dependencies]
ed25519-dalek = { version = "2.2", features = ["std"] }
curve25519-dalek = "5.0"
sha2 = "0.10"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.4"

http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true, features = ["channel"] }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }

# Shared transport dependencies are optional for the client and interop features.
hyper = { version = "1", optional = true, features = ["server", "http1"] }
# TokioIo adapter and Tower service bridge.
hyper-util = { version = "0.1", optional = true, features = ["tokio", "service"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
hickory-resolver = { version = "=0.26.1", default-features = false, features = ["tokio", "system-config"], optional = true }
hickory-net = { version = "=0.26.1", default-features = false, features = ["tokio"], optional = true }
hickory-proto = { version = "=0.26.1", default-features = false, optional = true }

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.13"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tower = { version = "0.5", features = ["util"] }
time = { version = "=0.3.47", default-features = false, features = ["std", "parsing"] }
