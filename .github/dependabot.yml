version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The ref of the dtolnay/rust-toolchain action is the toolchain version: it pins the MSRV 1.88 jobs.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
