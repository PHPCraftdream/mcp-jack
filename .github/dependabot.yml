version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Ref action dtolnay/rust-toolchain и есть версия toolchain: она держит MSRV 1.88 jobs.
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
