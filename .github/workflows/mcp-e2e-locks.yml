name: MCP E2E SDK pins bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mcp-e2e-locks.yml'
      - 'tools/mcp-e2e-modern/pins/**'

permissions:
  contents: read

jobs:
  bootstrap:
    name: mcp e2e pins bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: bash tools/mcp-e2e-modern/pins/bootstrap.sh pins-bootstrap
      - name: Upload bootstrap artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-e2e-pins-bootstrap
          path: pins-bootstrap/
          if-no-files-found: warn
