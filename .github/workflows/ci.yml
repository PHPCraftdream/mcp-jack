name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" && echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  go-race:
    name: go race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  fixtures:
    name: fixtures are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and compare
        run: node spec/tools/gen-fixtures.mjs --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Core without the http feature
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features
      - name: Client HTTP feature isolation
        if: runner.os == 'Linux'
        run: cargo check --locked --no-default-features --features client-http --lib

  rust-msrv:
    name: rust 1.85 check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked --all-targets --all-features

  ts:
    name: ts (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  interop:
    name: interop matrix (3x3)
    runs-on: ubuntu-latest
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Go executables
        run: |
          go build -o interop/bin/go-server ./interop/go/server
          go build -o interop/bin/go-client ./interop/go/client
      - name: Build Rust executables
        working-directory: rust
        run: cargo build --locked --release --features interop
      - name: Build TypeScript executables
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: node interop/run.mjs --self-test
      - name: Run the matrix
        run: node interop/run.mjs

  credential-transfer:
    name: credential transfer matrix (3x3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Go transfer executable
        run: go build -o interop/bin/go-transfer ./interop/go/transfer
      - name: Build Rust transfer executable
        working-directory: rust
        run: cargo build --locked --release --features interop --bin interop-transfer
      - name: Build TypeScript transfer executable
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Transfer self-test
        run: node interop/transfer.mjs --self-test
      - name: Run credential transfer matrix
        run: node interop/transfer.mjs

  consumer-ts:
    name: consumer ts (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install TypeScript workspace dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ts
      - name: Package the private npm tarball
        run: node tools/consumer/package-ts.mjs tools/consumer/.scratch/ts-consumer
      - name: Verify from a standalone consumer install
        run: node tools/consumer/verify-ts.mjs tools/consumer/.scratch/ts-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-ts-node${{ matrix.node }}-artifact
          path: |
            tools/consumer/.scratch/ts-consumer/mcp-jack-0.0.0.tgz
            tools/consumer/.scratch/ts-consumer/inventory.json
          if-no-files-found: error

  consumer-rust:
    name: consumer rust 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.85
      - name: Package the .crate artifact
        run: node tools/consumer/package-rust.mjs tools/consumer/.scratch/rust-consumer
      - name: Verify from a standalone consumer crate
        run: node tools/consumer/verify-rust.mjs tools/consumer/.scratch/rust-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-rust-artifact
          path: |
            tools/consumer/.scratch/rust-consumer/mcp-jack-0.1.0.crate
            tools/consumer/.scratch/rust-consumer/inventory.json
          if-no-files-found: error

  consumer-go:
    name: consumer go 1.22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the staged module snapshot
        run: node tools/consumer/package-go.mjs tools/consumer/.scratch/go-consumer
      - name: Tar the staged module snapshot
        run: tar -czf tools/consumer/.scratch/go-consumer/go-module-snapshot.tgz -C tools/consumer/.scratch/go-consumer module
      - name: Verify from a standalone consumer module
        run: node tools/consumer/verify-go.mjs tools/consumer/.scratch/go-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-go-artifact
          path: |
            tools/consumer/.scratch/go-consumer/go-module-snapshot.tgz
            tools/consumer/.scratch/go-consumer/inventory.json
          if-no-files-found: error
