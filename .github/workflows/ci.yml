name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" && echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  go-race:
    name: go race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - name: Repeat owned-pipe and admission regressions under race detector
        run: go test -race -count=5 ./internal/cli -run '^Test(OwnedPipeBrokenOutputAndBackpressure|BridgeAdmission.*)$'

  go-cli-process:
    name: Go CLI binary process qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.11'
      - name: Build the shipping CLI without CGO
        run: go build -trimpath -o "$RUNNER_TEMP/jack" ./cmd/jack
      - name: Exercise the real executable through the owned process harness
        env:
          JACK_CLI_EXECUTABLE: ${{ runner.temp }}/jack
        run: go test -count=1 -v ./internal/cli

  go-cli-process-darwin:
    name: Go CLI native Darwin process qualification
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.11'
      - name: Use a canonical runner temporary directory
        run: |
          printf 'TMPDIR=%s\n' "$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Record native compiler and target
        run: |
          go version
          go env GOOS GOARCH
      - name: Build the shipping CLI without CGO
        run: go build -trimpath -o "$RUNNER_TEMP/jack" ./cmd/jack
      - name: Exercise the native executable through the owned process harness
        env:
          JACK_CLI_EXECUTABLE: ${{ runner.temp }}/jack
        run: go test -count=1 -v ./internal/cli

  go-cli-artifacts:
    name: Go CLI portable artifact qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      FEATURE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.26.11'
      - name: Test inventory guards without running binary fixtures
        run: python3 -I -m unittest discover -s tools/binaries -p 'test_*.py' -v
      - name: Build six targets twice from independent source roots and caches
        run: >-
          python3 -I tools/binaries/qualify.py
          --source "$GITHUB_WORKSPACE"
          --output "$RUNNER_TEMP/jack-cli-portable"
          --expected-sha "$GITHUB_SHA"
          --feature-sha "$FEATURE_REVISION"
      - name: Upload verified development binaries and inventory only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jack-cli-development-${{ github.sha }}
          path: ${{ runner.temp }}/jack-cli-portable/
          if-no-files-found: error
          compression-level: 1

  fixtures:
    name: fixtures are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Regenerate and compare
        run: node spec/tools/gen-fixtures.mjs --check

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Core without the http feature
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features
      - name: Client HTTP feature isolation
        if: runner.os == 'Linux'
        run: cargo check --locked --no-default-features --features client-http --lib

  rust-msrv:
    name: rust 1.88 check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
      - run: cargo check --locked --all-targets --all-features

  ts:
    name: ts (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  interop:
    name: interop matrix (3x3)
    runs-on: ubuntu-latest
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            rust
            interop/rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Build Go executables
        run: |
          go build -o interop/bin/go-server ./interop/go/server
          go build -o interop/bin/go-client ./interop/go/client
      - name: Build Rust executables
        working-directory: interop/rust
        run: cargo build --locked --release
      - name: Build TypeScript executables
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: node interop/run.mjs --self-test
      - name: Run the matrix
        run: node interop/run.mjs

  rotation-interop:
    name: rotation interop matrix (3x3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            rust
            interop/rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Build Go rotation executables
        run: |
          go build -o interop/bin/go-rotation-server ./interop/go/rotationserver
          go build -o interop/bin/go-rotation-client ./interop/go/rotationclient
      - name: Build Rust executables
        working-directory: interop/rust
        run: cargo build --locked --release
      - name: Build TypeScript executables
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: node interop/rotation.mjs --self-test
      - name: Run the rotation matrix
        run: node interop/rotation.mjs

  durable-interop:
    name: durable nonce interop matrix (3x3, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            rust
            interop/rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Build Go executables
        run: |
          go build -o interop/bin/go-server ./interop/go/server
          go build -o interop/bin/go-client ./interop/go/client
      - name: Build Rust executables
        working-directory: interop/rust
        run: cargo build --locked --release
      - name: Build TypeScript executables
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: node interop/durable.mjs --self-test
      - name: Run the durable restart matrix
        run: node interop/durable.mjs

  mcp-compat-e2e:
    name: mcp compat e2e (official clients x official servers)
    runs-on: ubuntu-latest
    needs: [go, rust, ts, fixtures]
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: tools/mcp-e2e/rust
      - name: Require committed fixture lockfiles
        run: |
          missing=0
          for f in tools/mcp-e2e/go/go.sum tools/mcp-e2e/ts/package-lock.json tools/mcp-e2e/rust/Cargo.lock; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f: generate it from the pinned fixtures (go mod tidy / npm install / cargo generate-lock) and commit it before this job can run."
              missing=1
            fi
          done
          exit "$missing"
      - name: Download pinned Go fixture dependencies
        working-directory: tools/mcp-e2e/go
        run: go mod download
      - name: Install pinned TypeScript fixtures
        working-directory: tools/mcp-e2e/ts
        run: npm ci --no-audit --no-fund
      - name: Build the Rust fixtures (locked)
        working-directory: tools/mcp-e2e/rust
        run: cargo build --locked --release
      - name: Build the shipping CLI
        run: go build -trimpath -o "$RUNNER_TEMP/jack" ./cmd/jack
      - name: Run the official MCP SDK end-to-end matrix
        env:
          JACK_BIN: ${{ runner.temp }}/jack
        # Known limitation: the official TypeScript server answers initialize with SSE and the
        # gateway refuses SSE by design. The skip is explicit and every skipped cell is listed.
        run: node tools/mcp-e2e/run.mjs --allow-skip-ts-server

  credential-transfer:
    name: credential transfer matrix (3x3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go, rust, ts, fixtures]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            rust
            interop/rust
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Build Go transfer executable
        run: go build -o interop/bin/go-transfer ./interop/go/transfer
      - name: Build Rust transfer executable
        working-directory: interop/rust
        run: cargo build --locked --release --bin interop-transfer
      - name: Build TypeScript transfer executable
        working-directory: ts
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Transfer self-test
        run: node interop/transfer.mjs --self-test
      - name: Run credential transfer matrix
        run: node interop/transfer.mjs

  consumer-ts:
    name: consumer ts (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install TypeScript workspace dependencies
        run: npm ci --no-audit --no-fund
        working-directory: ts
      - name: Package the private npm tarball
        run: node tools/consumer/package-ts.mjs tools/consumer/.scratch/ts-consumer
      - name: Verify from a standalone consumer install
        run: node tools/consumer/verify-ts.mjs tools/consumer/.scratch/ts-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-ts-node${{ matrix.node }}-artifact
          path: |
            tools/consumer/.scratch/ts-consumer/mcp-jack-0.0.0.tgz
            tools/consumer/.scratch/ts-consumer/inventory.json
          if-no-files-found: error

  consumer-rust:
    name: consumer rust 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
      - name: Package the .crate artifact
        run: node tools/consumer/package-rust.mjs tools/consumer/.scratch/rust-consumer
      - name: Verify from a standalone consumer crate
        run: node tools/consumer/verify-rust.mjs tools/consumer/.scratch/rust-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-rust-artifact
          path: |
            tools/consumer/.scratch/rust-consumer/mcp-jack-0.1.0.crate
            tools/consumer/.scratch/rust-consumer/inventory.json
          if-no-files-found: error

  consumer-go:
    name: consumer go 1.25
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Package the staged module snapshot
        run: node tools/consumer/package-go.mjs tools/consumer/.scratch/go-consumer
      - name: Tar the staged module snapshot
        run: tar -czf tools/consumer/.scratch/go-consumer/go-module-snapshot.tgz -C tools/consumer/.scratch/go-consumer module
      - name: Verify from a standalone consumer module
        run: node tools/consumer/verify-go.mjs tools/consumer/.scratch/go-consumer
      - name: Upload package artifact and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-go-artifact
          path: |
            tools/consumer/.scratch/go-consumer/go-module-snapshot.tgz
            tools/consumer/.scratch/go-consumer/inventory.json
          if-no-files-found: error
