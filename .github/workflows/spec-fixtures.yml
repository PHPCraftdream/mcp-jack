# Spec fixture materialization.
#
# This workflow exists for environments that cannot run Node locally: it
# materializes the generated fixtures (spec/fixtures JSON files and
# spec/tests/CASES.md) as a CI artifact. The parent review flow downloads the
# artifact and integrates the bytes. The existing `fixtures` job in ci.yml —
# `gen-fixtures.mjs --check` — remains the standing staleness gate and is NOT
# modified or replaced by this workflow.

name: spec fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate and upload fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate fixtures
        run: node spec/tools/gen-fixtures.mjs
      - name: Verify regeneration is deterministic
        run: node spec/tools/gen-fixtures.mjs --check
      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-generated-fixtures
          path: |
            spec/fixtures/keys.json
            spec/fixtures/registry.json
            spec/fixtures/request-vectors.json
            spec/fixtures/admin-vectors.json
            spec/fixtures/response-vectors.json
            spec/fixtures/key-vectors.json
            spec/fixtures/load-vectors.json
            spec/fixtures/state-file-vectors.json
            spec/tests/CASES.md
          if-no-files-found: error

  candidate-generate:
    name: generate and upload candidate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check committed candidate fixtures before regeneration
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Generate candidate fixtures
        run: node spec/tools/candidate/gen-fixtures.mjs
      - name: Verify candidate regeneration is deterministic
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Verify candidate fixtures
        run: node spec/tools/candidate/verify-fixtures.mjs
      - name: Test candidate fixtures
        run: node --test spec/tests/candidate/*.test.mjs
      - name: Upload generated candidate fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-candidate-generated-fixtures
          path: |
            spec/fixtures/candidate/rotation-vectors.json
            spec/fixtures/candidate/nonce-vectors.json
            spec/fixtures/candidate/rotation-state-vectors.json
            spec/tests/candidate/CASES.md
          if-no-files-found: error

  mcp-e2e-preparation:
    name: prepare MCP E2E fixtures
    if: github.ref == 'refs/heads/release-mcp-e2e-1115'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/mcp-e2e/rust
      - name: Generate fixture lockfiles and format sources
        run: |
          (cd tools/mcp-e2e/go && go mod tidy)
          gofmt -w tools/mcp-e2e/go
          (cd tools/mcp-e2e/ts && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd tools/mcp-e2e/rust && cargo generate-lockfile && cargo fmt --all)
      - name: Upload generated lockfiles and formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-e2e-generated
          path: |
            tools/mcp-e2e/go/go.mod
            tools/mcp-e2e/go/go.sum
            tools/mcp-e2e/go/**/*.go
            tools/mcp-e2e/ts/package-lock.json
            tools/mcp-e2e/rust/Cargo.lock
            tools/mcp-e2e/rust/src/**/*.rs
          if-no-files-found: error
      - name: Download pinned Go fixture dependencies
        if: always()
        working-directory: tools/mcp-e2e/go
        run: go mod download
      - name: Install pinned TypeScript fixtures
        if: always()
        working-directory: tools/mcp-e2e/ts
        run: npm ci --no-audit --no-fund
      - name: Build the Rust fixtures (locked)
        if: always()
        working-directory: tools/mcp-e2e/rust
        run: cargo build --locked --release
      - name: Build the shipping CLI
        if: always()
        run: go build -trimpath -o "$RUNNER_TEMP/jack" ./cmd/jack
      - name: Run the official MCP SDK end-to-end matrix
        if: always()
        env:
          JACK_BIN: ${{ runner.temp }}/jack
        run: node tools/mcp-e2e/run.mjs
