# Spec fixture materialization.
#
# This workflow exists for environments that cannot run Node locally: it
# materializes the generated fixtures (spec/fixtures JSON files and
# spec/tests/CASES.md) as a CI artifact. The parent review flow downloads the
# artifact and integrates the bytes. The existing `fixtures` job in ci.yml —
# `gen-fixtures.mjs --check` — remains the standing staleness gate and is NOT
# modified or replaced by this workflow.

name: spec fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate and upload fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate fixtures
        run: node spec/tools/gen-fixtures.mjs
      - name: Verify regeneration is deterministic
        run: node spec/tools/gen-fixtures.mjs --check
      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-generated-fixtures
          path: |
            spec/fixtures/keys.json
            spec/fixtures/registry.json
            spec/fixtures/request-vectors.json
            spec/fixtures/admin-vectors.json
            spec/fixtures/response-vectors.json
            spec/fixtures/key-vectors.json
            spec/fixtures/load-vectors.json
            spec/fixtures/state-file-vectors.json
            spec/tests/CASES.md
          if-no-files-found: error

  candidate-generate:
    name: generate and upload candidate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check committed candidate fixtures before regeneration
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Generate candidate fixtures
        run: node spec/tools/candidate/gen-fixtures.mjs
      - name: Verify candidate regeneration is deterministic
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Verify candidate fixtures
        run: node spec/tools/candidate/verify-fixtures.mjs
      - name: Test candidate fixtures
        run: node --test spec/tests/candidate/*.test.mjs
      - name: Upload generated candidate fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-candidate-generated-fixtures
          path: |
            spec/fixtures/candidate/rotation-vectors.json
            spec/fixtures/candidate/nonce-vectors.json
            spec/fixtures/candidate/rotation-state-vectors.json
            spec/tests/candidate/CASES.md
          if-no-files-found: error

  rust-source-preparation:
    name: prepare Rust SDK sources
    if: github.ref == 'refs/heads/release-sdk-rust-ts-1110'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve approved hickory-net and hickory-resolver 0.26.2 pins and lock in CI
        run: |
          sed -i 's/^hickory-net = { version = "=0.26.1"/hickory-net = { version = "=0.26.2"/; s/^hickory-resolver = { version = "=0.26.1"/hickory-resolver = { version = "=0.26.2"/' Cargo.toml
          cargo update -p hickory-net --precise 0.26.2
          cargo update -p hickory-resolver --precise 0.26.2
          git diff -- Cargo.toml Cargo.lock
      - name: Format candidate Rust sources in CI
        run: cargo fmt --all
      - name: Format standalone Rust store consumer in CI
        run: rustfmt --edition 2024 ../tools/consumer/rust/src/rotation_store.rs
      - name: Test candidate rotation without default features
        timeout-minutes: 10
        run: cargo test --locked --no-default-features --lib --test rotation --test rotation_trust --test rotation_server
      - name: Upload formatted sources for parent integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-sdk-formatted-sources
          path: |
            rust/Cargo.toml
            rust/Cargo.lock
            rust/src/lib.rs
            rust/src/client/mod.rs
            rust/src/client/rotation_auth.rs
            rust/src/rotation/*.rs
            rust/tests/rotation.rs
            rust/tests/rotation_trust.rs
            rust/tests/rotation_trust/json.rs
            rust/tests/rotation_server.rs
          if-no-files-found: error
      - name: Upload formatted standalone consumer for parent integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-consumer-formatted-sources
          path: |
            tools/consumer/rust/src/main.rs
            tools/consumer/rust/src/rotation_store.rs
          if-no-files-found: error
