# Spec fixture materialization.
#
# This workflow exists for environments that cannot run Node locally: it
# materializes the generated fixtures (spec/fixtures JSON files and
# spec/tests/CASES.md) as a CI artifact. The parent review flow downloads the
# artifact and integrates the bytes. The existing `fixtures` job in ci.yml —
# `gen-fixtures.mjs --check` — remains the standing staleness gate and is NOT
# modified or replaced by this workflow.

name: spec fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate and upload fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate fixtures
        run: node spec/tools/gen-fixtures.mjs
      - name: Verify regeneration is deterministic
        run: node spec/tools/gen-fixtures.mjs --check
      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-generated-fixtures
          path: |
            spec/fixtures/keys.json
            spec/fixtures/registry.json
            spec/fixtures/request-vectors.json
            spec/fixtures/admin-vectors.json
            spec/fixtures/response-vectors.json
            spec/fixtures/key-vectors.json
            spec/fixtures/load-vectors.json
            spec/fixtures/state-file-vectors.json
            spec/tests/CASES.md
          if-no-files-found: error

  candidate-generate:
    name: generate and upload candidate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check committed candidate fixtures before regeneration
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Generate candidate fixtures
        run: node spec/tools/candidate/gen-fixtures.mjs
      - name: Verify candidate regeneration is deterministic
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Verify candidate fixtures
        run: node spec/tools/candidate/verify-fixtures.mjs
      - name: Test candidate fixtures
        run: node --test spec/tests/candidate/*.test.mjs
      - name: Upload generated candidate fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-candidate-generated-fixtures
          path: |
            spec/fixtures/candidate/rotation-vectors.json
            spec/fixtures/candidate/nonce-vectors.json
            spec/fixtures/candidate/rotation-state-vectors.json
            spec/tests/candidate/CASES.md
          if-no-files-found: error

  rust-source-preparation:
    name: prepare Rust SDK sources
    if: github.ref == 'refs/heads/release-sdk-rust-ts-1110'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Materialize only the approved Rustix lock additions
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib

          lock = Path("Cargo.lock")
          before = tomllib.loads(lock.read_text())
          subprocess.run(
              ["cargo", "metadata", "--format-version", "1"],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          after = tomllib.loads(lock.read_text())
          identity = lambda package: (
              package["name"], package["version"], package.get("source")
          )
          old = {identity(package): package for package in before["package"]}
          new = {identity(package): package for package in after["package"]}
          assert old.keys() <= new.keys(), "Existing lock package removed or upgraded"
          for key, package in old.items():
              expected = dict(package)
              if package["name"] == "mcp-jack" and "source" not in package:
                  expected["dependencies"] = sorted(
                      [*package["dependencies"], "rustix"]
                  )
              assert new[key] == expected, "Unapproved existing lock record change"
          added = [new[key] for key in new.keys() - old.keys()]
          assert {(p["name"], p["version"]) for p in added} == {
              ("rustix", "1.1.6"), ("linux-raw-sys", "0.12.1")
          }, "Unapproved new lock packages"
          expected_checksums = {
              "rustix": "e5e76742e5294153d4dde1207dbec5bdd81eef6fabdc0d2118babadabfd858aa",
              "linux-raw-sys": "32a66949e030da00e8c7d4434b251670a91556f4144941d37452769c25d58a53",
          }
          for package in added:
              assert package["source"] == "registry+https://github.com/rust-lang/crates.io-index"
              assert package["checksum"] == expected_checksums[package["name"]]
          assert {k: v for k, v in before.items() if k != "package"} == {
              k: v for k, v in after.items() if k != "package"
          }, "Unapproved lock metadata change"
          print("Approved Rustix lock additions verified before compilation")
          PY
      - name: Format candidate Rust sources in CI
        run: cargo fmt --all
      - name: Test candidate rotation without default features
        timeout-minutes: 10
        run: cargo test --locked --no-default-features --lib --test rotation --test rotation_trust
      - name: Upload formatted sources for parent integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-sdk-formatted-sources
          path: |
            rust/Cargo.lock
            rust/src/lib.rs
            rust/src/client/mod.rs
            rust/src/client/rotation_auth.rs
            rust/src/rotation/*.rs
            rust/tests/rotation.rs
            rust/tests/rotation_trust.rs
            rust/tests/rotation_trust/json.rs
          if-no-files-found: error
