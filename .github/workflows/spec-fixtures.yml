# Spec fixture materialization.
#
# This workflow exists for environments that cannot run Node locally: it
# materializes the generated fixtures (spec/fixtures JSON files and
# spec/tests/CASES.md) as a CI artifact. The parent review flow downloads the
# artifact and integrates the bytes. The existing `fixtures` job in ci.yml —
# `gen-fixtures.mjs --check` — remains the standing staleness gate and is NOT
# modified or replaced by this workflow.

name: spec fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: generate and upload fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate fixtures
        run: node spec/tools/gen-fixtures.mjs
      - name: Verify regeneration is deterministic
        run: node spec/tools/gen-fixtures.mjs --check
      - name: Upload generated fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-generated-fixtures
          path: |
            spec/fixtures/keys.json
            spec/fixtures/registry.json
            spec/fixtures/request-vectors.json
            spec/fixtures/admin-vectors.json
            spec/fixtures/response-vectors.json
            spec/fixtures/key-vectors.json
            spec/fixtures/load-vectors.json
            spec/fixtures/state-file-vectors.json
            spec/tests/CASES.md
          if-no-files-found: error

  candidate-generate:
    name: generate and upload candidate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check committed candidate fixtures before regeneration
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Generate candidate fixtures
        run: node spec/tools/candidate/gen-fixtures.mjs
      - name: Verify candidate regeneration is deterministic
        run: node spec/tools/candidate/gen-fixtures.mjs --check
      - name: Verify candidate fixtures
        run: node spec/tools/candidate/verify-fixtures.mjs
      - name: Test candidate fixtures
        run: node --test spec/tests/candidate/*.test.mjs
      - name: Upload generated candidate fixtures
        uses: actions/upload-artifact@v4
        with:
          name: spec-candidate-generated-fixtures
          path: |
            spec/fixtures/candidate/rotation-vectors.json
            spec/fixtures/candidate/nonce-vectors.json
            spec/fixtures/candidate/rotation-state-vectors.json
            spec/tests/candidate/CASES.md
          if-no-files-found: error

  go-source-preparation:
    name: prepare Go SDK sources
    if: github.ref == 'refs/heads/release-go-durable-1110'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
      - name: Resolve and verify the approved Go backend dependency graph
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          go mod tidy
          go mod verify
      - name: Format changed Go SDK sources in CI
        run: gofmt -w rotation/*.go client/rotation_auth*.go client/auth.go client/auth_extreme_test.go durable/*.go server/admission.go server/admission_test.go server/verify.go server/middleware.go server/response_signer*.go tools/consumer/go/*.go internal/cli/gateway*.go internal/cli/run.go internal/cli/nonce_admin*.go
      - name: Test codec, admission and backend ownership without CGO
        env:
          CGO_ENABLED: '0'
        run: go test ./rotation ./client ./server ./durable ./internal/cli
      - name: Upload formatted sources for parent integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-sdk-formatted-sources
          path: |
            go.mod
            go.sum
            rotation/*.go
            client/rotation_auth*.go
            client/auth.go
            client/auth_extreme_test.go
            durable/*.go
            tools/consumer/go/*.go
            server/admission.go
            server/admission_test.go
            server/verify.go
            server/middleware.go
            server/response_signer*.go
            internal/cli/gateway*.go
            internal/cli/run.go
            internal/cli/nonce_admin*.go
          if-no-files-found: error
